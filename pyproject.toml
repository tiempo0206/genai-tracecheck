[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-tracecheck"
version = "0.1.0"
description = "Deterministic quality and privacy checks for OpenTelemetry GenAI traces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tianbo" }]
keywords = ["opentelemetry", "genai", "observability", "security", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
genai-tracecheck = "genai_tracecheck.cli:main"

[project.urls]
Repository = "https://github.com/tiempo0206/genai-tracecheck"
Issues = "https://github.com/tiempo0206/genai-tracecheck/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
