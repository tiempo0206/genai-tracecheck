name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: coverage run -m pytest && coverage report
      - name: Exercise the CLI
        run: |
          genai-tracecheck check examples/valid.otlp.json --output reports/valid.json
          genai-tracecheck check examples/structured-content.otlp.json \
            --output reports/structured-content.json
          genai-tracecheck check examples/partial-trace.otlp.json \
            --output reports/partial-trace.json
          genai-tracecheck check examples/latency-tokens.otlp.json \
            --output reports/latency-tokens.json
          genai-tracecheck batch examples/valid.otlp.json examples/latency-tokens.otlp.json \
            --output reports/batch-valid.json
          genai-tracecheck batch 'examples/framework/*.otlp.json' \
            --output reports/framework-fixtures.json
          genai-tracecheck check examples/valid.otlp.json --config examples/policy.toml \
            --output reports/configured-valid.json
          if genai-tracecheck check examples/risky.otlp.json; then
            echo "Expected risky fixture to fail"
            exit 1
          fi
          if genai-tracecheck check examples/malformed-content.otlp.json; then
            echo "Expected malformed content fixture to fail"
            exit 1
          fi
          if genai-tracecheck check examples/graph-issues.otlp.json; then
            echo "Expected graph issues fixture to fail"
            exit 1
          fi
          if genai-tracecheck check examples/inconsistent-usage.otlp.json; then
            echo "Expected inconsistent usage fixture to fail"
            exit 1
          fi
          if genai-tracecheck check examples/partial-trace.otlp.json \
            --trace-completeness complete; then
            echo "Expected complete-trace policy to reject a missing parent"
            exit 1
          fi
          if genai-tracecheck batch examples/valid.otlp.json examples/risky.otlp.json; then
            echo "Expected a batch containing the risky fixture to fail"
            exit 1
          fi
          if genai-tracecheck check examples/structured-content.otlp.json \
            --config examples/policy.toml --fail-on warning; then
            echo "Expected explicit warning threshold to override configuration"
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the wheel
        run: |
          python -m venv "${{ runner.temp }}/tracecheck-wheel"
          "${{ runner.temp }}/tracecheck-wheel/bin/python" -m pip install dist/*.whl
          "${{ runner.temp }}/tracecheck-wheel/bin/genai-tracecheck" --version
