name: TraceCheck SARIF demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sarif-demo.yml
      - examples/risky.otlp.json
      - src/genai_tracecheck/**

permissions:
  contents: read
  security-events: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TraceCheck
        run: python -m pip install .
      - name: Generate the expected failing demonstration report
        run: |
          set +e
          genai-tracecheck check examples/risky.otlp.json \
            --format sarif --output reports/tracecheck.sarif
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected the deliberately risky fixture to fail with exit code 1"
            exit 1
          fi
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/tracecheck.sarif
          category: genai-tracecheck-demo
